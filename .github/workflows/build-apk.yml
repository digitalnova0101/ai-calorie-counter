name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ~/.android && cp tools/debug.keystore ~/.android/debug.keystore
          cd app
          {
            flutter --version
            flutter create --org com.digitalnova --project-name aicaloriecounter --platforms android .
            rm -f test/widget_test.dart
            python3 ../tools/patch_android.py
            python3 ../tools/make_firebase_options.py ../google-services.json lib/firebase_options.dart com.digitalnova.aicaloriecounter
            flutter pub get
            if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
              echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
              printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n" "$UPLOAD_KEY_PASSWORD" "$UPLOAD_KEY_PASSWORD" > android/key.properties
              echo "Signing with the Play Store upload key"
            else
              echo "No upload key secrets yet: test signing only"
            fi
            API="$( (cat ../config/api_url.txt 2>/dev/null || true) | tr -d '[:space:]')"
            V="--build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}"
            flutter build apk --release --split-per-abi $V --dart-define=API_URL="$API"
            if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then flutter build appbundle --release $V --dart-define=API_URL="$API"; fi
          } 2>&1 | tee ../build-log.txt
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}

      - name: Layout check (pictures of the new cards)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          cd app
          flutter test test/cards_test.dart --update-goldens 2>&1 | tail -60 > ../layout-log.txt || true
          mkdir -p ../layout && cp test/goldens/*.png ../layout/ 2>/dev/null || true

      - name: Publish the APK
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          O=app/build/app/outputs/flutter-apk
          cp $O/app-arm64-v8a-release.apk AI-Calorie-Counter.apk
          cp $O/app-armeabi-v7a-release.apk AI-Calorie-Counter-old-phones.apk
          FILES="AI-Calorie-Counter.apk AI-Calorie-Counter-old-phones.apk"
          if [ -f app/build/app/outputs/bundle/release/app-release.aab ]; then cp app/build/app/outputs/bundle/release/app-release.aab AI-Calorie-Counter-PlayStore.aab; FILES="$FILES AI-Calorie-Counter-PlayStore.aab"; fi
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" $FILES \
            --title "AI Calorie Counter $TAG" \
            --notes "Phone: download **AI-Calorie-Counter.apk** and tap Install (if it says the app is not compatible, use AI-Calorie-Counter-old-phones.apk). Play Store: upload **AI-Calorie-Counter-PlayStore.aab** (only present once the upload key is set)." \
            --latest

      - name: Save build log for checking
        if: always()
        shell: bash
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          STATUS="${{ steps.build.outcome }}"
          git fetch origin ci-logs 2>/dev/null && git checkout -B ci-logs origin/ci-logs || git checkout --orphan ci-logs
          git rm -rfq --cached . >/dev/null 2>&1 || true
          echo "run ${{ github.run_number }} commit ${{ github.sha }} status $STATUS" > status.txt
          tail -c 200000 build-log.txt > last-build-log.txt 2>/dev/null || echo "no log" > last-build-log.txt
          rm -rf layout-shots && mkdir -p layout-shots && cp layout/*.png layout-shots/ 2>/dev/null || true
          cp layout-log.txt layout-shots/ 2>/dev/null || true
          git add -f status.txt last-build-log.txt layout-shots
          git commit -qm "build ${{ github.run_number }}: $STATUS" && git push -f origin ci-logs
